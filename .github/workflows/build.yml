# Builds the plugin jar for you on GitHub, so you do not need Java 25 installed.
# Push this project to a GitHub repository, open the "Actions" tab, open the latest run and
# download the "MaceSMPTracker" artifact.
name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build -x test --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MaceSMPTracker
          path: build/libs/*.jar
